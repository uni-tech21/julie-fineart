<!DOCTYPE HTML>
<html>

<head>
  <title>Contact Julia Heart</title>
  <meta name="description" content="Contact Julia Heart" />
  <meta name="keywords" content="Julia Heart, contact, art, enquiry" />
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <script type="text/javascript" src="js/modernizr-1.5.min.js"></script>
</head>

<body>
  <div id="main">
    <header>
      <div id="logo"><h1>JULIA<a href="#">HEART</a></h1></div>
      <nav>
        <ul class="lavaLampWithImage" id="lava_menu">
          <li><a href="index.html">home</a></li>
          <li><a href="about.html">about Julia</a></li>
          <li><a href="portfolio.html">gallery</a></li>
          <li class="current"><a href="https://juliemartinfineart.lovestoblog.com/contact.php">contact</a></li>
        </ul>
      </nav>
    </header>

    <div id="site_content">
      <div id="sidebar_container">
        <div id="gallery">
          <ul class="images">
            <li class="show"><img width="450" height="450" src="images/1.jpg" alt="Artwork by Julia Heart" /></li>
            <li><img width="450" height="450" src="images/2.jpg" alt="Artwork by Julia Heart" /></li>
            <li><img width="450" height="450" src="images/3.jpg" alt="Artwork by Julia Heart" /></li>
            <li><img width="450" height="450" src="images/4.jpg" alt="Artwork by Julia Heart" /></li>
            <li><img width="450" height="450" src="images/5.jpg" alt="Artwork by Julia Heart" /></li>
          </ul>
        </div>
      </div>

      <div id="content">
        <h1>Contact Julia Heart</h1>

        <form id="contact" method="post">
          <div class="form_settings">
            <p>
              <span>Name</span>
              <input class="contact" type="text" name="your_name" value="" />
            </p>

            <p>
              <span>Email Address</span>
              <input class="contact" type="text" name="your_email" value="" />
            </p>

            <p>
              <span>Message</span>
              <textarea class="contact textarea" rows="5" cols="50" name="your_message"></textarea>
            </p>

            <!-- Hidden fields to satisfy the current PHP backend validation -->
            <input type="hidden" name="user_answer" value="0" />
            <input type="hidden" name="answer" value="08495d565e" />

            <p style="padding-top: 15px">
  <span>&nbsp;</span>
  <input class="submit" type="submit" name="contact_submitted" value="send" />
</p>

<p id="form-message" style="padding-top:10px;"></p>
          </div>
        </form>
      </div>
    </div>

    <footer>
      <p>www.juliaheart.co.uk</p>
    </footer>
  </div>

  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/jquery.easing.min.js"></script>
  <script type="text/javascript" src="js/jquery.lavalamp.min.js"></script>
  <script type="text/javascript" src="js/image_fade.js"></script>
  <script type="text/javascript">
    $(function() {
      $("#lava_menu").lavaLamp({
        fx: "backout",
        speed: 700
      });
    });
  </script>
  <script>
document.getElementById('contact').addEventListener('submit', async function (e) {
  e.preventDefault();

  const form = e.target;
  const formData = new FormData(form);
  formData.append('contact_submitted', 'send');
  const messageBox = document.getElementById('form-message');

  messageBox.textContent = 'Sending...';
  messageBox.style.color = 'black';

  try {
    const response = await fetch('https://unitech.page.gd/cors-test.php', {
      method: 'POST',
      body: formData
    });

    const text = await response.text();
    console.log('STATUS:', response.status);
    console.log('RESPONSE TEXT:', text);

    if (text.toLowerCase().includes('your message has been sent')) {
      messageBox.textContent = 'Your message has been sent.';
      messageBox.style.color = 'blue';
      form.reset();
    } else {
      messageBox.textContent = 'There was a problem sending your message.';
      messageBox.style.color = 'red';
    }
  } catch (error) {
    console.error('FETCH ERROR:', error);
    messageBox.textContent = 'There was a problem sending your message.';
    messageBox.style.color = 'red';
  }
});
</script>
</body>
</html>
